            --frame-inset: 20px;
        }
        body {
            margin: 0;
            padding: 0;

            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
        }
        /* Typography */
        body,
        a,
        p,
        h1,
        h2,
        h3,
        .label,
        .caption,
        div {
            color: black;
            text-decoration: none;
        }
        a:visited {
            color: black;
        }
        /* FRAME LINKS: always black */
        .frame-side,
        .frame-side .label,
        .frame-side:visited,
        .frame-side .label:visited {
            color: black !important;
        }
        /* 
           FRAME STYLING (MINIMAL BLACK LINES)
           We remove the wood texture and replace it with simple black borders.
        */
        .frame-side {
            position: fixed;
            background-color: white;
            /* No Border - lines are drawn by visual layer */
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
        }
        /* 
           Visual Layer for Diagonal Joints 
           Since clip-path cuts off borders at the diagonals, we draw specific lines.
        */
        .frame-visuals {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1002;
            /* Above frame sides */
        }
        .outer-rect {
            position: absolute;
            top: var(--frame-inset);
            left: var(--frame-inset);
            right: var(--frame-inset);
            bottom: var(--frame-inset);
            border: 2px solid black;
        }
        .inner-rect {
            position: absolute;
            top: calc(var(--frame-inset) + var(--frame-thickness));
            left: calc(var(--frame-inset) + var(--frame-thickness));
            right: calc(var(--frame-inset) + var(--frame-thickness));
            bottom: calc(var(--frame-inset) + var(--frame-thickness));
            border: 2px solid black;
        }
        .corner-line {
            position: absolute;
            background-color: black;
            height: 2px;
            /* 
               Width = distance from outer corner to inner corner = thickness * sqrt(2) 
               55 * 1.414 = 77.78px.
               Set to 77.5px to bridge the gap perfectly without overshooting visually.
            */
            width: 77.8px;
            transform-origin: 0 50%;
        }
        /* 
           Positioning corners at the "inset" point where bars meet.
        */
        .corner-tl {
            top: var(--frame-inset);
            left: var(--frame-inset);
            transform: rotate(45deg);
        }
        .corner-tr {
            top: var(--frame-inset);
            left: calc(100% - var(--frame-inset));
            transform: rotate(135deg);
        }
        .corner-bl {
            bottom: var(--frame-inset);
            left: var(--frame-inset);
            transform: rotate(-45deg);
        }
        .corner-br {
            bottom: var(--frame-inset);
            left: calc(100% - var(--frame-inset));
            transform: rotate(-135deg);
        }
        /* TOP */
        .frame-top {
            top: var(--frame-inset);
            left: var(--frame-inset);
            right: var(--frame-inset);
            height: var(--frame-thickness);
            /* Mitered visual using clip-path */
            clip-path: polygon(0% 0%, 100% 0%, calc(100% - var(--frame-thickness) + 1px) 100%, calc(var(--frame-thickness) - 1px) 100%);
        }
        /* BOTTOM */
        .frame-bottom {
            bottom: var(--frame-inset);
            left: var(--frame-inset);
            right: var(--frame-inset);
            height: var(--frame-thickness);
            clip-path: polygon(calc(var(--frame-thickness) - 1px) 0%, calc(100% - var(--frame-thickness) + 1px) 0%, 100% 100%, 0% 100%);
        }
        /* LEFT */
        .frame-left {
            top: var(--frame-inset);
            bottom: var(--frame-inset);
            left: var(--frame-inset);
            width: var(--frame-thickness);
            clip-path: polygon(0% 0%, 100% calc(var(--frame-thickness) - 1px), 100% calc(100% - var(--frame-thickness) + 1px), 0% 100%);
        }
        /* RIGHT */
        .frame-right {
            top: var(--frame-inset);
            bottom: var(--frame-inset);
            right: var(--frame-inset);
            width: var(--frame-thickness);
            clip-path: polygon(0% calc(var(--frame-thickness) - 1px), 100% 0%, 100% 100%, 0% calc(100% - var(--frame-thickness) + 1px));
        }
        /* Label Styling */
        .frame-side .label {
            color: black !important;
            white-space: nowrap;
            /* ← key change */
            max-width: none;
            /* ← remove artificial constraint */
            line-height: 1;
            text-align: center;
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .frame-side:hover .label {
            opacity: 1;
        }
        .frame-side:hover {
            background-color: #f0f0f0;
            /* Slight grey on hover to indicate clickable */
        }
        .frame-left .label {
            transform: rotate(-90deg);
        }
        .frame-right .label {
            transform: rotate(90deg);
        }
        /* Content Styling */
        .content {
            font-size: 25px;
            position: relative;
            text-align: center;
            /* Adjusted width to account for frame */
            width: calc(100% - 2 * (var(--frame-inset) + var(--frame-thickness) + 20px));

            justify-content: center;

            justify-content: center;
            padding: 40px;
            height: 100%;
        }
        .post.image .image-viewer {
            width: 100%;
            height: 100%;

        .post.image img {

            height: 100%;

        .post.image a {

        .post.image a img {
            width: 100%;
            height: 100%;

        .post.text {
            display: block;
            padding: 60px;
            text-align: left;
            font-size: 35px;
            /* ← adjust this */
            line-height: 1.5;

        .post.text .text-post {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .post.text .text-post::-webkit-scrollbar {
            display: none;
        }
        /* FULL VIDEO */
        .post.video {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            height: 100%;
        }
        .post.video .video-viewer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .post.video iframe {
            max-width: 100%;
            max-height: 100%;
            /* Keep aspect ratio if possible, but contained */
            aspect-ratio: 16 / 9;
            width: 100%;
            height: auto;
        }
        /* If the screen is too wide (wider than 16:9), height is 100% and width auto */
        @media (min-aspect-ratio: 16/9) {
            .post.video iframe {
                height: 100%;
                width: auto;
            }
        }
    </style>

            { id: 'p14', title: 'nothing', content: '<p>Pale reflections on a calm lake.</p><img src="https://via.placeholder.com/500x350/C0C0C0/000000?text=Moonlight" alt="Moon">' },
            { id: 'p15', title: 'nothing', content: '<p>Nothing is here but potential.</p><img src="https://via.placeholder.com/500x350/000000/FFFFFF?text=The+Void" alt="Void">' }
        ];
        function init() {
            loadPage('p1');
        }
        function loadPage(pageId) {
            const page = pages.find(p => p.id === pageId);
            if (!page) return;
            const container = document.getElementById('dynamic-content');
            let html = '';
            if (page.layout === 'image') {
                var imageHTML = page.link
                    ? '<a href="' + page.link + '" target="_blank" rel="noopener noreferrer" class="custom-tumblr-link">' +
                    '<img src="' + page.images[0] + '" alt="">' +
                    '</a>'
                    : '<img src="' + page.images[0] + '" alt="">';
                html =
                    '<article class="post image">' +
                    '<div class="image-viewer">' +
                    imageHTML +
                    '</div>' +
                    '</article>';
            } else if (page.layout === 'video') {
                html =
                    '<article class="post video">' +
                    '<div class="video-viewer">' +
                    page.embed +
                    '</div>' +
                    '</article>';
            } else if (page.layout === 'text') {
                html =
                    '<article class="post text">' +
                    '<div class="text-post">' +
                    page.content +
                    '</div>' +
                    '</article>';
            } else {
                html =
                    '<article class="post split">' +
                    '<div class="text-post">' +
                    page.content +
                    '</div>' +
                    '<div class="image-viewer">' +
                    (page.images ? '<img src="' + page.images[0] + '" alt="">' : '') +
                    '</div>' +
                    '</article>';
            }
            container.innerHTML = html;
            setupImageViewer(page.images || []);
            assignRandomLinks(pageId);
        }
        function setupImageViewer(images) {
            if (!images || images.length <= 1) return;
            const viewer = document.querySelector('.image-viewer');
            const img = viewer.querySelector('img');
            let index = 0;
            viewer.addEventListener('click', () => {
                index = (index + 1) % images.length;
                img.src = images[index];
            });
        }
        function assignRandomLinks(excludeId) {
            const available = pages.filter(p => p.id !== excludeId);
            for (let i = available.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [available[i], available[j]] = [available[j], available[i]];
            }
            const selected = available.slice(0, 4);
            const positions = ['top', 'right', 'bottom', 'left'];
            positions.forEach((pos, index) => {
                if (selected[index]) {
                    const el = document.getElementById('frame-' + pos);
                    const page = selected[index];
                    const label = el.querySelector('.label');
                    label.textContent = page.title;
                    el.title = page.title;
                    el.onclick = (e) => {
                        e.preventDefault();
                        loadPage(page.id);
                    };
                }
            });
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
